appId: com.system-intel-mic.luma
productName: Luma
executableName: Luma
copyright: Copyright © 2026 SYSTEM-Intel-MIC
directories:
  output: release
files:
  - dist/**/*
  - dist-electron/**/*
  - "node_modules/better-sqlite3/**/*"
asarUnpack:
  - "node_modules/better-sqlite3/**/*"
npmRebuild: true
win:
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Luma
