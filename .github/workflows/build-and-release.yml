name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build packages
        run: pnpm build:packages

      - name: Run tests
        run: pnpm test

      - name: Type check
        run: pnpm typecheck

  build:
    name: Build & Package
    runs-on: windows-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build:packages

      - name: Build Vite frontend
        run: pnpm --filter @luma/desktop build:vite

      - name: Build Electron app
        run: pnpm --filter @luma/desktop build:electron

      - name: List release files
        shell: bash
        run: |
          echo "Release files:"
          ls -la apps/desktop/release/ 2>/dev/null || echo "No release directory yet"
          find apps/desktop -name "*.exe" -o -name "*.msi" 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luma-windows
          path: apps/desktop/release/*.exe
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: needs.build.result == 'success' && startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: luma-windows
          path: release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Luma ${{ github.ref_name }}
          body: |
            ## Luma ${{ github.ref_name }}

            Your AI on Windows — An open-source Windows AI Agent.

            ### What's New
            - Initial release of Luma
            - AI Agent runtime with full execution loop
            - Tool system (filesystem, shell, windows, network, process, system)
            - 5-level permission system with risk engine
            - Multi-provider model support
            - Floating UI with Ctrl+Space global shortcut
            - System tray integration

            ### Installation
            Download `Luma Setup.exe` and run to install.

            ### Requirements
            - Windows 10 / 11
            - AI model API key (configure in Settings)

            **Developed by SYSTEM-Intel-MIC**
            Licensed under GPL-3.0
          draft: false
          prerelease: false
          files: release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
